name: Racing Dominion Release APK

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check race rules, geometry, and vehicle handling
      run: |
        g++ -std=c++17 -Itests/native/stubs -Iengine/core -Iengine/graphics -Iengine/math -Iengine/physics -Iengine/assets \
          tests/native/geometry_test.cpp engine/core/Track.cpp engine/core/Engine.cpp engine/graphics/DominionCar.cpp \
          engine/graphics/Camera.cpp engine/physics/Vehicle.cpp -o "$RUNNER_TEMP/racing-dominion-check"
        "$RUNNER_TEMP/racing-dominion-check"
    
    - name: Set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'

    # The repository does not commit gradle/wrapper/gradle-wrapper.jar.
    # Install the pinned Gradle distribution instead of calling the broken wrapper.
    - name: Install Gradle 8.2
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.2'

    - name: Check Gradle installation
      run: gradle --version

    - name: Check multitouch controls
      run: |
        mkdir -p "$RUNNER_TEMP/dominion-java-check"
        javac -d "$RUNNER_TEMP/dominion-java-check" app/src/main/java/com/racing/engine/TouchControls.java \
          app/src/main/java/com/racing/engine/RaceSnapshot.java tests/java/TouchControlsTest.java
        java -cp "$RUNNER_TEMP/dominion-java-check" co.za.chefu.racingdominion.TouchControlsTest

    - name: Install required Android components
      run: |
        SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
        echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
        "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"
    
    - name: Prepare release signing key
      if: github.event_name != 'pull_request'
      env:
        RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: |
        for variable in RELEASE_KEYSTORE_BASE64 RELEASE_STORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
          if [ -z "${!variable}" ]; then
            echo "::error::Missing repository secret: $variable. See docs/RELEASE_SIGNING.md."
            exit 1
          fi
        done
        umask 077
        printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/racing-dominion-release.jks"

    - name: Build signed release APK
      if: github.event_name != 'pull_request'
      env:
        RELEASE_STORE_FILE: ${{ runner.temp }}/racing-dominion-release.jks
        RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
      run: gradle :app:assembleRelease --stacktrace --warning-mode all

    - name: Validate unsigned release APK for pull request
      if: github.event_name == 'pull_request'
      run: gradle :app:assembleRelease --stacktrace --warning-mode all

    - name: Verify release APK
      id: apk
      run: |
        if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          APK_PATH="app/build/outputs/apk/release/app-release-unsigned.apk"
          ARTIFACT_NAME="racing-dominion-release-unsigned-apk"
        else
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          ARTIFACT_NAME="racing-dominion-release-apk"
          "$ANDROID_SDK_ROOT/build-tools/34.0.0/apksigner" verify "$APK_PATH"
        fi
        test -s "$APK_PATH"
        echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"
        echo "artifact=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"

    - name: Upload release APK
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.apk.outputs.artifact }}
        path: |
          ${{ steps.apk.outputs.path }}
          app/build/outputs/apk/release/output-metadata.json
        if-no-files-found: error
        retention-days: 30

    - name: Remove temporary signing key
      if: always()
      run: rm -f -- "$RUNNER_TEMP/racing-dominion-release.jks"

    - name: Upload native libraries
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: native-libraries
        path: |
          app/build/intermediates/merged_native_libs/release/**/*.so
        if-no-files-found: ignore
    
    - name: Run unit tests
      run: gradle :app:testReleaseUnitTest --stacktrace
      continue-on-error: true
      
    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          app/build/reports/tests/
          app/build/test-results/
        if-no-files-found: ignore
    
    - name: Build summary
      if: always()
      env:
        APK_PATH: ${{ steps.apk.outputs.path }}
        APK_ARTIFACT: ${{ steps.apk.outputs.artifact }}
      run: |
        echo "# Racing Dominion release build" >> "$GITHUB_STEP_SUMMARY"
        if [ -n "$APK_PATH" ] && [ -s "$APK_PATH" ]; then
          echo "- APK: $(basename "$APK_PATH")" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: $APK_ARTIFACT" >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA256: $(sha256sum "$APK_PATH" | cut -d' ' -f1)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "- Unsigned validation build; cannot be installed until signed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Release signature verified. Download the artifact above to install." >> "$GITHUB_STEP_SUMMARY"
          fi
        else
          echo "No verified release APK produced. Check the failed step and signing secrets." >> "$GITHUB_STEP_SUMMARY"
        fi
