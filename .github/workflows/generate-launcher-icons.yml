name: Generate Racing Dominion Icons

on:
  workflow_dispatch:

jobs:
  generate-icons:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install icon renderer
        run: pip install Pillow==12.3.0
      - name: Generate Dominion RD monogram icons
        run: python tools/generate_launcher_icons.py
      - name: Commit launcher icons
        run: |
          git config user.name "Icon Generator Bot"
          git config user.email "icons@github-actions.bot"
          git add app/src/main/res/mipmap-*/
          if git diff --staged --quiet; then
            echo "Icons already match the Racing Dominion design."
          else
            git commit -m "Update Racing Dominion launcher icons"
            git push
          fi
      - name: Upload icon preview
        uses: actions/upload-artifact@v4
        with:
          name: racing-dominion-launcher-icons
          path: app/src/main/res/mipmap-*/*.png
